name: ci
on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V toolchain and simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-misc

      - name: Build rvcc
        run: make

      - name: Differential verification (host vs rvcc vs gcc on qemu)
        run: python3 tests/run_tests.py
